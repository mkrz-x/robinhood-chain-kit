name: release

# This workflow does NOT publish. It attests.
#
# Publishing from CI needs a trusted publisher on npmjs.com, and two attempts
# (v0.6.0, v0.8.0) were rejected with a 404 on the PUT while the OIDC token
# minted provenance fine. The second failure is unambiguous — 0.8.0 was not on
# the registry at all, so the only thing a 404 can mean there is that the
# registry declined the token. Rather than leave a red X on every tag, the
# release is published by hand (`npm run release`) and this run proves the
# result.
#
# What it proves is worth more than it sounds. It rebuilds the tag's tree from
# scratch and compares the tarball checksum against the one npm is actually
# serving. A hand publish from a dirty working tree, from the wrong branch, or
# from a stale dist/ does not match, and that is exactly the failure mode a
# manual release introduces. Every gate below still fails closed.
#
# To go back to publishing from CI: set the trusted publisher on npmjs.com
# (mkrz-x / robinhood-chain-kit / release.yml, and the Environment field must
# match whatever this file declares — it currently declares none), restore
# `id-token: write`, add back `publishConfig.provenance`, and replace the
# attestation step with `npm publish`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/package-lock.json

      - name: read the release identity
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # A tag is a claim about which version this is. If it disagrees with
      # package.json, one of the two is a mistake and we cannot tell which.
      - name: tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} claims $tag, package.json says $VERSION"
            exit 1
          fi

      # The CHANGELOG is how a consumer finds out what changed. Shipping a
      # version it has never heard of makes it worse than absent, because it
      # now reads as complete when it is not.
      - name: changelog must describe this version
        run: |
          notes="$(awk -v v="$VERSION" '
            # dots in a semver are regex wildcards until escaped, and the
            # trailing class stops 0.6.0 from matching a future 0.6.0-rc
            BEGIN { gsub(/\./, "\\.", v); re = "^## " v "([^0-9.]|$)" }
            $0 ~ re { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md)"
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section"
            exit 1
          fi
          {
            echo "NOTES<<CHANGELOG_EOF"
            printf '%s\n' "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm ci --prefix examples

      # ci.yml already ran this on main, but not on this commit — a tag can
      # point anywhere. Types, build, the full suite, publint, Are the Types
      # Wrong, the packed ESM+CJS smoke test, and the examples type-check,
      # against the exact tree this tag names.
      - name: verify
        run: npm run verify

      # THE ATTESTATION.
      #
      # A hand publish is a human running a command on a laptop, so the thing
      # worth checking is not that a publish happened but that the bytes on the
      # registry are the ones this tag builds. A dirty tree, a stale dist/ or
      # the wrong branch all produce a tarball that does not match here.
      #
      # `npm view <pkg>@<missing>` exits 0 with empty output, so the exit code
      # proves nothing — the output is the signal.
      #
      # --ignore-scripts: `verify` above already built dist, and prepack would
      # print its build log into the JSON about to be parsed.
      - name: the published tarball must be what this tag builds
        run: |
          published="$(npm view "$NAME@$VERSION" dist.shasum 2>/dev/null || true)"
          if [ -z "$published" ]; then
            echo "::error::$NAME@$VERSION is not on the registry."
            echo "::error::this workflow attests a release, it does not create one."
            echo "::error::publish first:  npm run release"
            exit 1
          fi
          built="$(npm pack --dry-run --json --ignore-scripts 2>/dev/null \
            | node -p "JSON.parse(require('fs').readFileSync(0,'utf8'))[0].shasum")"
          if [ "$published" != "$built" ]; then
            echo "::error::the tarball on npm is NOT what this tag builds"
            echo "::error::registry $published"
            echo "::error::this tag $built"
            echo "::error::the published version came from a different tree — do not release this tag"
            exit 1
          fi
          echo "verified: $NAME@$VERSION on npm is byte-identical to $GITHUB_REF_NAME ($built)"

      - name: github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$NAME v$VERSION" \
            --notes "$NOTES"
